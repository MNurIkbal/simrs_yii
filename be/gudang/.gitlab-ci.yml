stages:
  - deploy

pull-development:
  stage: deploy
  tags:
    - development
    - gwk
    - gudang
  only:
    - develop-gwk
  script:
    - cd /var/www/sirs/be/gudang
    - sudo -u root sh -c "git pull origin develop-gwk"
    - curl -s -X POST https://api.telegram.org/$teleBotId/sendMessage -d chat_id=$teleChatId -d text="Pull di <b>Modul Gudang branch develop-gwk</b> --> $CI_COMMIT_MESSAGE " -d "parse_mode=HTML"
